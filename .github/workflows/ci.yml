name: MilestoneFund CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  # 1. Frontend Build & Static Typecheck
  frontend-build:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Typecheck
        run: npx tsc --noEmit

      - name: Run Automated Test Suite
        run: npm test

      - name: Build Next.js Production App
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_STELLAR_NETWORK: TESTNET
          NEXT_PUBLIC_HORIZON_URL: https://horizon-testnet.stellar.org
          NEXT_PUBLIC_SOROBAN_RPC_URL: https://soroban-testnet.stellar.org
          NEXT_PUBLIC_ESCROW_VAULT_ADDRESS: GBSW6X4P5UBWU2GQCA57JDZ74A5WNBYOQJFPWLAKPS2GZBEYCNJKNCCD
        run: npm run build

  # 2. Soroban Smart Contract Verification
  soroban-contracts-test:
    name: Soroban Smart Contracts Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Pin compatible ed25519-dalek dependency
        working-directory: contracts/milestone_fund
        run: cargo update -p ed25519-dalek --precise 2.1.1 || true

      - name: Run Cargo Tests
        working-directory: contracts/milestone_fund
        run: cargo test

      - name: Build Soroban Contract WASM Target
        working-directory: contracts/milestone_fund
        run: cargo build --target wasm32-unknown-unknown --release
